# Препресс-Планер (web + прокси сервисов) внутри сети compose.
# Сервисы доступны по именам: converter/auth/payments (не по 127.0.0.1!).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Flutter web (SPA): неизвестные пути -> index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Конвертер (FastAPI :8120): джобы и статика результатов.
    location = /healthz {
        proxy_pass http://converter:8120/healthz;
        proxy_read_timeout 5s;
    }
    location /convert {
        proxy_pass http://converter:8120;
        proxy_read_timeout 220s;
        proxy_http_version 1.1;
    }
    location /data {
        proxy_pass http://converter:8120;
        proxy_read_timeout 60s;
    }

    # Проекты и файлы (services/api, ADR-5/6): срезаем префикс /api.
    location /api/ {
        proxy_pass http://api:8100/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 64m;
    }

    # auth и payments — маршруты уже с префиксами /auth, /payments.
    location /auth {
        proxy_pass http://auth:8121;
        proxy_read_timeout 20s;
    }
    location /payments {
        proxy_pass http://payments:8122;
        proxy_read_timeout 20s;
    }
    # Админ-панель (отдельный сервис).
    location /admin {
        proxy_pass http://admin:8130;
        proxy_read_timeout 30s;
    }
    # Права организации (алиас /payments/entitlement, ADR-3).
    location /entitlement {
        proxy_pass http://payments:8122;
        proxy_read_timeout 20s;
    }

    client_max_body_size 64m;
}
