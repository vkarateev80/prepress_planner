# Препресс-Планер SaaS — nginx с TLS и единым origin (ADR-6).
# Публичный порт только 443; 80 переадресует. Внутренние сервисы
# (converter/auth/billing/api/domain-worker/minio) доступны только через прокси.
#
# Лимиты (System Design §4, §12.5): тело запроса ≤ 64m с запасом над
# PP_MAX_MB=50 (проверка размера — в api, русская ошибка 413);
# rate-limit по IP на загрузку и скачивание файлов.

limit_req_zone $binary_remote_addr zone=pp_upload:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=pp_download:10m rate=120r/m;

server {
    listen 80;
    server_name _;

    # ACME HTTP-01 (certbot webroot, HANDOFF §9 п.1) — отдаётся до редиректа.
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # TLS (производство: Let's Encrypt; разработка: собственный сертификат в ./nginx/certs)
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 64m;

    # === Flutter Web (SPA) ===
    location / {
        try_files $uri $uri/ /index.html;
    }

    # === API (FastAPI control plane: проекты/файлы/расчёты) ===
    # Прокси срезает префикс /api: api принимает и /api/..., и /api/v1/...
    # (middleware нормализует путь), поэтому контракты §12.4/§12.5 работают.
    location /api/ {
        proxy_pass http://api:8100/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        # Загрузка файла (POST /api/projects/{id}/files) — лимит по IP.
        limit_req zone=pp_upload burst=10 nodelay;
    }

    # === Файлы (поток через API с проверкой entitlement/org) ===
    location /files/ {
        proxy_pass http://api:8100/files/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        limit_req zone=pp_download burst=60 nodelay;
    }

    # === Presigned URL объекта (ADR-5): api отдаёт ссылку вида /s3/<bucket>/...,
    # подписанную SigV4 и живущую PP_PRESIGN_TTL секунд. Прямой доступ к MinIO
    # без подписи невозможен; bucket наружу не публикуется.
    location ^~ /s3/ {
        rewrite ^/s3/(.*)$ /$1 break;
        proxy_pass http://minio:9000;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
        limit_req zone=pp_download burst=60 nodelay;
    }

    # === Отчёты (PDF/XLSX/DXF) ===
    location /reports/ {
        proxy_pass http://api:8100/reports/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        limit_req zone=pp_download burst=60 nodelay;
    }

    # === Конвертер (внутренний вызов, не публичный порт) ===
    location /convert {
        proxy_pass http://converter:8120;
        proxy_read_timeout 220s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
    }
    location /data {
        proxy_pass http://converter:8120;
        proxy_read_timeout 60s;
        proxy_http_version 1.1;
    }

    # === Auth и Billing (внутренние вызовы через единый origin) ===
    location /auth {
        proxy_pass http://auth:8121;
        proxy_read_timeout 20s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /payments {
        proxy_pass http://billing:8122;
        proxy_read_timeout 20s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Права организации (алиас /payments/entitlement, ADR-3) для API и UI.
    location /entitlement {
        proxy_pass http://billing:8122;
        proxy_read_timeout 20s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # === Healthcheck агрегат ===
    location = /healthz {
        access_log off;
        return 200 '{"status":"ok","service":"nginx-edge"}';
    }
}
