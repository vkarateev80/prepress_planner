# Контрольный API (ADR-5/6): проекты, файлы, отчёты, расчёты.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: prepress
  labels:
    app: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      initContainers:
        - name: wait-deps
          image: busybox:1.36
          command:
            - sh
            - -c
            # -w 2: без таймаута nc зависает на SYN-drop до появления
            # endpoints (yadro-таймаут ~15 мин) — живой урок приёмки.
            - |
              until nc -z -w 2 postgresql 5432; do sleep 1; done
              until nc -z -w 2 minio 9000; do sleep 1; done
              until nc -z -w 2 auth 8121; do sleep 1; done
              until nc -z -w 2 billing 8122; do sleep 1; done
              until nc -z -w 2 converter 8120; do sleep 1; done
              until nc -z -w 2 domain-worker 8101; do sleep 1; done
      containers:
        - name: api
          image: pp-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8100
          env:
            - name: PP_DATA_DIR
              value: /srv/api/data
            - name: PP_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pp-secrets
                  key: PP_DB_PASSWORD
            - name: DB_URL
              value: postgresql://pp_user:$(PP_DB_PASSWORD)@postgresql:5432/prepress_saas
            - name: AUTH_URL
              value: http://auth:8121
            - name: PP_AUTH_URL
              value: http://auth:8121
            - name: BILLING_URL
              value: http://billing:8122
            - name: PP_BILLING_URL
              value: http://billing:8122
            - name: CONVERTER_URL
              value: http://converter:8120
            - name: DOMAIN_WORKER_URL
              value: http://domain-worker:8101
            - name: OBJECT_STORAGE_ENDPOINT
              value: http://minio:9000
            - name: OBJECT_STORAGE_PUBLIC_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: pp-config
                  key: PP_PUBLIC_BASE
            - name: OBJECT_STORAGE_BUCKET
              value: prepress-saas
            - name: OBJECT_STORAGE_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: pp-secrets
                  key: MINIO_ACCESS_KEY
            - name: OBJECT_STORAGE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: pp-secrets
                  key: MINIO_SECRET_KEY
            - name: OBJECT_STORAGE_PREFIX
              value: org
            - name: PP_MAX_MB
              value: "50"
            - name: PP_PRESIGN_TTL
              value: "300"
            - name: PP_MAX_FILE_VERSIONS
              value: "20"
            - name: PP_ENTITLEMENT_ENFORCE
              value: "1"
            - name: PP_AUTH_REQUIRED
              value: "1"
          volumeMounts:
            - name: data
              mountPath: /srv/api/data
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8100
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8100
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: prepress
spec:
  selector:
    app: api
  ports:
    - port: 8100
      targetPort: 8100
