# Edge внутри кластера: статика SPA + прокси сервисов на plain HTTP.
# TLS-терминация и ACME — Traefik (Ingress), см. 40-ingress.yaml.
#
# Отличия от pp-web-tls.conf: один server-блок listen 80, без ssl/редиректа;
# X-Forwarded-Proto берётся от Traefik (map с фолбэком на $scheme).
map $http_x_forwarded_proto $pp_fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

limit_req_zone $binary_remote_addr zone=pp_upload:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=pp_download:10m rate=120r/m;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 64m;

    # === Flutter Web (SPA) ===
    location / {
        try_files $uri $uri/ /index.html;
    }

    # === API (проекты/файлы/расчёты/отчёты) — префикс /api срезается ===
    location /api/ {
        proxy_pass http://api:8100/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $pp_fwd_proto;
        proxy_read_timeout 120s;
        limit_req zone=pp_upload burst=10 nodelay;
    }

    location /files/ {
        proxy_pass http://api:8100/files/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $pp_fwd_proto;
        proxy_read_timeout 120s;
        limit_req zone=pp_download burst=60 nodelay;
    }

    location /reports/ {
        proxy_pass http://api:8100/reports/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $pp_fwd_proto;
        proxy_read_timeout 120s;
        limit_req zone=pp_download burst=60 nodelay;
    }

    location ^~ /s3/ {
        rewrite ^/s3/(.*)$ /$1 break;
        proxy_pass http://minio:9000;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
        limit_req zone=pp_download burst=60 nodelay;
    }

    location /convert {
        proxy_pass http://converter:8120;
        proxy_read_timeout 220s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
    }
    location /data {
        proxy_pass http://converter:8120;
        proxy_read_timeout 60s;
        proxy_http_version 1.1;
    }

    location /auth {
        proxy_pass http://auth:8121;
        proxy_read_timeout 20s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $pp_fwd_proto;
    }
    location /payments {
        proxy_pass http://billing:8122;
        proxy_read_timeout 20s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $pp_fwd_proto;
    }
    location /entitlement {
        proxy_pass http://billing:8122;
        proxy_read_timeout 20s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $pp_fwd_proto;
    }

    location = /healthz {
        access_log off;
        return 200 '{"status":"ok","service":"nginx-edge"}';
    }
}
