apiVersion: v1
kind: Pod
metadata:
  name: pg-drill
  namespace: prepress
  labels: {app: pg-drill}
spec:
  securityContext:
    runAsUser: 70
    runAsGroup: 70
    fsGroup: 70
  initContainers:
    - name: chown
      image: postgres:16-alpine
      imagePullPolicy: IfNotPresent
      command: ["chown", "-R", "70:70", "/var/lib/postgresql/data"]
      securityContext:
        runAsUser: 0
      volumeMounts:
        - name: pgdata
          mountPath: /var/lib/postgresql/data
  containers:
    - name: pg-drill
      image: postgres:16-alpine
      imagePullPolicy: IfNotPresent
      env:
        - name: POSTGRES_USER
          value: pp_user
        - name: POSTGRES_PASSWORD
          value: drill
        - name: POSTGRES_DB
          value: prepress_saas
      volumeMounts:
        - name: pgdata
          mountPath: /var/lib/postgresql/data
  volumes:
    - name: pgdata
      emptyDir: {}
