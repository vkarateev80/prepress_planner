# Несекретная конфигурация стека (паритет с deploy/docker-compose.yml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: pp-config
  namespace: prepress
data:
  PP_PUBLIC_BASE: "https://prepressplan.ru"
  PP_RETURN_PATH: "/billing/return"
  # ЮKassa: несекретная часть остаётся в ConfigMap; SHOP_ID/SECRET_KEY/
  # WEBHOOK_SECRET живут в секрете pp-secrets (см. 21-billing.yaml
  # secretKeyRef) — в git не попадают. До подстановки реального shop_id
  # значение "PENDING".
  YUKASSA_API_URL: "https://api.yookassa.ru/v3"
  YUKASSA_SAVE_PAYMENT_METHOD: "0"
  # SMTP хостинга reg.ru (проверено: AUTH 235 OK на mail.hosting.reg.ru:587,
  # STARTTLS; логин = полный адрес ящика).
  PP_SMTP_HOST: "mail.hosting.reg.ru"
  PP_SMTP_PORT: "587"
  PP_SMTP_USER: "info@prepressplan.ru"
  PP_SMTP_PASSWORD: "Info_Pp2026!"
  PP_SMTP_FROM: "info@prepressplan.ru"
  PP_SMTP_SSL: ""
  PP_RESEND_COOLDOWN: "60"
