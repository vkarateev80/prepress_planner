# Edge: SPA + прокси. Статика — в образе pp-web (см. Dockerfile.web).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: prepress
  labels:
    app: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: pp-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: prepress
spec:
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 80
