# PostgreSQL 16 — метаданные проектов/файлов/подписок (ADR-5).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pg-data
  namespace: prepress
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgresql
  namespace: prepress
  labels:
    app: postgresql
spec:
  replicas: 1
  strategy:
    type: Recreate          # RWO-том: без параллельных подов
  selector:
    matchLabels:
      app: postgresql
  template:
    metadata:
      labels:
        app: postgresql
    spec:
      containers:
        - name: postgresql
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: prepress_saas
            - name: POSTGRES_USER
              value: pp_user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pp-secrets
                  key: PP_DB_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "pp_user", "-d", "prepress_saas"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "pp_user", "-d", "prepress_saas"]
            initialDelaySeconds: 30
            periodSeconds: 15
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pg-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgresql
  namespace: prepress
spec:
  selector:
    app: postgresql
  ports:
    - port: 5432
      targetPort: 5432
