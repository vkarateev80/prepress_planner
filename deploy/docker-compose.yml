# Полный стек «Препресс-Планер» для нового сервера: converter (8120),
# auth (8121), payments (8122) и web-версия через nginx (8081, единый origin).
#
# Запуск с этого каталога (deploy/):
#   cp .env.example .env        # при необходимости задайте PP_AUTH_SECRET
#   docker compose up -d --build
#
# Структура:
#   ../services/converter auth payments — исходники сервисов (build-контексты);
#   ./web                           — статика flutter build web (см. build_bundle);
#   ./nginx/pp-web.conf             — конфиг nginx (прокси на имена сервисов).
#
# ВАЖНО: nginx стоит в той же сети compose и ходит к сервисам по именам
# (converter/auth/payments) — никакого CORS, единый origin http://<host>:8081.
services:
  converter:
    build: ../services/converter
    image: pp-converter:latest
    ports:
      - "8120:8120"
    environment:
      PP_DATA_DIR: /srv/converter/data
      PP_JOB_STORE: file
      PP_JOB_TTL_HOURS: "24"
    volumes:
      - converter-data:/srv/converter/data
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8120/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  auth:
    build: ../services/auth
    image: pp-auth:latest
    ports:
      - "8121:8121"
    environment:
      PP_DATA_DIR: /srv/auth/data
      PP_AUTH_SECRET: ${PP_AUTH_SECRET:?задайте PP_AUTH_SECRET в .env}
      PP_TOKEN_TTL: "720"
      PP_RESET_TTL: "30"
      # Почта для сброса пароля (необязательно; без неё код — dev-режим).
      PP_SMTP_HOST: ${PP_SMTP_HOST:-}
      PP_SMTP_PORT: ${PP_SMTP_PORT:-587}
      PP_SMTP_USER: ${PP_SMTP_USER:-}
      PP_SMTP_PASSWORD: ${PP_SMTP_PASSWORD:-}
      PP_SMTP_FROM: ${PP_SMTP_FROM:-}
    volumes:
      - auth-data:/srv/auth/data
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8121/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  payments:
    build: ../services/payments
    image: pp-payments:latest
    ports:
      - "8122:8122"
    environment:
      PP_DATA_DIR: /srv/payments/data
      PP_AUTH_URL: http://auth:8121   # внутренний адрес auth в этой сети
    volumes:
      - payments-data:/srv/payments/data
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8122/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  web:
    image: nginx:alpine
    ports:
      - "8081:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./nginx/pp-web.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - converter
      - auth
      - payments
    restart: unless-stopped

volumes:
  converter-data:
  auth-data:
  payments-data:
