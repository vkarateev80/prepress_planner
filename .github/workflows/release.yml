name: Release

on:
  push:
    tags: ['v*']

jobs:
  domain-tests:
    name: Тесты домена
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: bash scripts/run_domain_tests.sh

  flutter-windows:
    name: Сборка Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: app
      - run: flutter build windows --release
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: prepress-planner-windows
          path: app/build/windows/x64/runner/Release/

  flutter-linux:
    name: Сборка Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev
      - run: flutter pub get
        working-directory: app
      - run: flutter build linux --release
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: prepress-planner-linux
          path: app/build/linux/x64/release/bundle/

  # iOS/macOS собираются на macOS-раннерах (Xcode) — включаются по необходимости:
  # flutter-macos:
  #   runs-on: macos-latest
  #   steps: ... flutter build macos --release + upload-artifact
  # flutter-ios:
  #   runs-on: macos-latest
  #   steps: ... flutter build ios --release --no-codesign + upload-artifact
