name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  domain:
    name: Домен (Dart, packages/core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Тесты домена
        run: bash scripts/run_domain_tests.sh

  flutter:
    name: Flutter (app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Зависимости
        run: flutter pub get
        working-directory: app
      - name: Анализ
        run: flutter analyze
        working-directory: app
      - name: Тесты
        run: flutter test
        working-directory: app

  services:
    name: Сервисы (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Пакеты конвертера
        run: pip install fastapi uvicorn python-multipart pytest httpx
      - name: Пакеты license-сервера
        run: pip install sqlalchemy cryptography
      - name: Тесты конвертера
        run: python -m pytest services/converter/tests -q
      - name: Тесты license
        run: python -m pytest services/license/tests -q
