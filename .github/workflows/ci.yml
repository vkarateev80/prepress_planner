name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  domain:
    name: Домен (Dart, packages/core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Тесты домена
        run: bash scripts/run_domain_tests.sh

  domain-worker:
    name: Домен-воркер (Dart VM, ADR-2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      # Единственная зависимость — path: packages/core (офлайн, без pub.dev).
      - name: Тесты и эталонные числа domain-worker
        run: bash scripts/run_domain_worker_tests.sh

  flutter:
    name: Flutter (app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Зависимости
        run: flutter pub get
        working-directory: app
      - name: Анализ
        run: flutter analyze
        working-directory: app
      - name: Тесты
        run: flutter test
        working-directory: app

  services:
    name: Сервисы (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Пакеты конвертера
        run: pip install fastapi uvicorn python-multipart pytest httpx
      - name: Пакеты license-сервера
        run: pip install sqlalchemy cryptography
      - name: Пакеты auth-сервиса
        run: pip install "pydantic[email]"
      - name: Пакеты API проектов/файлов (ADR-5)
        run: pip install -r services/api/requirements.txt
      - name: Тесты конвертера
        run: python -m pytest services/converter/tests -q
      - name: Тесты auth
        run: python -m pytest services/auth/tests -q
      - name: Тесты license
        run: python -m pytest services/license/tests -q
      - name: Тесты billing (ЮKassa, ADR-3)
        run: python -m pytest services/payments/tests -q
      - name: Тесты API проектов и файлов (S3+PostgreSQL, изоляция по org, N-4)
        run: python -m pytest services/api/tests -q

  deploy:
    name: Конфиги развёртывания (compose + nginx)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Валидация docker-compose (deploy и services)
        run: |
          PP_AUTH_SECRET=ci-validation docker compose -f deploy/docker-compose.yml config -q
          PP_AUTH_SECRET=ci-validation docker compose -f services/docker-compose.yml config -q
      - name: Dev-сертификаты для nginx -t
        run: bash deploy/nginx/gen_dev_certs.sh
      - name: nginx -t (pp-web-tls.conf)
        run: |
          docker run --rm \
            --add-host api:127.0.0.1 --add-host auth:127.0.0.1 --add-host billing:127.0.0.1 \
            --add-host converter:127.0.0.1 --add-host minio:127.0.0.1 --add-host payments:127.0.0.1 \
            -v "$PWD/deploy/nginx/pp-web-tls.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$PWD/deploy/nginx/certs:/etc/nginx/certs:ro" \
            nginx:alpine nginx -t
      - name: nginx -t (pp-web.conf)
        run: |
          docker run --rm \
            --add-host api:127.0.0.1 --add-host auth:127.0.0.1 \
            --add-host converter:127.0.0.1 --add-host payments:127.0.0.1 \
            -v "$PWD/deploy/nginx/pp-web.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:alpine nginx -t
