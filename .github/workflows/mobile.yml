name: Mobile (Android / iOS)

# Сборка мобильных версий «Препресс-Планер».
# Android: APK собирается на ubuntu-раннере (SDK ставится автоматически).
# iOS: сборка возможна только на macOS-раннере, подпись не требуется
#      (--no-codesign) — артефакт пригоден для проверки, но не для App Store.
# Для публикации нужны: keystore для Google Play и сертификат/профиль Apple.

on:
  push:
    branches: [master, main]
    paths:
      - 'app/**'
      - '.github/workflows/mobile.yml'
  pull_request:
    paths:
      - 'app/**'
  workflow_dispatch:

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Зависимости
        run: flutter pub get
        working-directory: app
      - name: Анализ
        run: flutter analyze
        working-directory: app
      - name: Тесты
        run: flutter test
        working-directory: app
      - name: Сборка APK (release)
        run: flutter build apk --release
        working-directory: app
      - name: Артефакт APK
        uses: actions/upload-artifact@v4
        with:
          name: prepress-planner-android-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  ios:
    name: iOS (без подписи)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Зависимости
        run: flutter pub get
        working-directory: app
      - name: Сборка iOS (без подписи)
        run: flutter build ios --release --no-codesign
        working-directory: app
      - name: Артефакт приложения
        uses: actions/upload-artifact@v4
        with:
          name: prepress-planner-ios-unsigned
          path: app/build/ios/iphoneos/Runner.app
          if-no-files-found: error
